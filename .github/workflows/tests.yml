name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - "ruochen/**"
      - "andrew/**"
      - "yulia/**"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run test suite
        run: uv run pytest
      - name: Run fixed-data pipeline evaluation
        run: uv run python -m evals.runner
      - name: Run 50-case contract corpus
        run: uv run python -m evals.contract_corpus
  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check desktop and mobile UI with synthetic chat responses
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/browser/
          retention-days: 14
